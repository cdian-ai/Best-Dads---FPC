<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alluwal</title>
<style>
  :root{
    --ink:#14181F; --accent:#2E8F98; --deep:#268189; --muted:#63757A;
    --line:#E6E2D9; --paper:#F4F1EA; --white:#fff;
    --mark:#C8562F; --gold:#D9A22E; --go:#1F6D4A; --gobg:#E4F2EA;
    --stop:#8E3320; --stopbg:#FBEAE5;
  }
  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:none}
  body{margin:0;color:var(--ink);
    font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(120% 60% at 50% -12%, rgba(46,143,152,.16) 0%, rgba(46,143,152,0) 58%),
      linear-gradient(180deg,#FBF9F5 0%,#FCFBF8 40%,#FDFDFB 100%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased}
  .wrap{max-width:430px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 120px}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .brand{flex:1;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .brand small{display:block;font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:0}
  .ghost{border:0;background:#fff;border-radius:999px;padding:8px 13px;font:inherit;
    font-size:13px;font-weight:750;color:var(--deep);cursor:pointer;
    box-shadow:0 2px 8px rgba(28,58,64,.1)}

  .card{background:var(--white);border-radius:22px;padding:18px 16px;
    box-shadow:0 3px 16px rgba(28,58,64,.1)}
  .kick{margin:0 0 5px;font-size:11.5px;font-weight:750;letter-spacing:.07em;
    text-transform:uppercase;color:var(--accent)}
  h2{margin:0 0 8px;font-size:20px;letter-spacing:-.02em;line-height:1.22}
  p{margin:0 0 10px}
  .sm{font-size:13.5px;color:var(--muted)}

  /* road */
  .road{display:grid;gap:8px}
  .stop{display:flex;align-items:center;gap:11px;background:var(--white);border:0;width:100%;
    text-align:left;border-radius:16px;padding:11px 13px;font:inherit;cursor:pointer;
    box-shadow:0 2px 10px rgba(28,58,64,.07)}
  .stop:disabled{opacity:.55;cursor:default;box-shadow:none;background:#FAF8F4}
  .stop .n{width:27px;height:27px;border-radius:50%;background:var(--paper);color:var(--deep);
    display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}
  .stop.done .n{background:var(--gobg);color:var(--go)}
  .stop.now{outline:2px solid var(--accent)}
  .stop b{flex:1;font-size:14.5px;font-weight:700;line-height:1.25}
  .stop small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
  .tick{color:var(--go);font-weight:800}

  /* arabic */
  .ar{font-family:"Geeza Pro","Noto Naskh Arabic","Al Bayan","Traditional Arabic",serif;
    direction:rtl;line-height:1.75}
  .grid{display:grid;gap:9px;margin:12px 0 4px;direction:rtl}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:13px 6px 9px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
  .tile .g{display:block;font-size:36px;line-height:1.25}
  .tile .n{display:block;margin-top:6px;font-size:11px;font-weight:700;color:var(--muted);direction:ltr}
  .tile.said{background:var(--gobg);border-color:#BFDCCD}
  .tile.said .n{color:var(--go)}
  .tile.yes{background:var(--gobg);border-color:#8FC5AA;outline:2px solid var(--go)}
  .tile.no{background:var(--stopbg);border-color:#E6C3B8}
  .mark{color:var(--mark)}

  /* ---- the chase field ----
     Lifted from Janngu exactly: same eight spots, same field height, same
     spring on left/top, same swell-and-settle. Only the palette differs. The
     letter moves between presses and never travels during one, so a child is
     always pressing a thing that is standing still. */
  .cue{text-align:center;font-size:12px;color:#93A0A4;margin:10px 0 10px;letter-spacing:.02em}
  .cue b{color:var(--ink);font-size:15px}
  .cue span{display:block;font-size:11px;font-weight:650;letter-spacing:.04em;color:#A2ADB1;margin-top:3px}
  .jfield{position:relative;width:100%;height:min(330px,44vh);min-height:230px;margin-top:10px;
    background:var(--paper);border-radius:22px;overflow:hidden}
  .jletter{position:absolute;transform:translate(-50%,-50%);
    min-width:96px;min-height:96px;padding:0 14px;border:none;border-radius:26px;
    background:#fff;color:var(--ink);font-size:52px;font-weight:600;
    cursor:pointer;box-shadow:0 4px 10px rgba(28,58,64,.16);
    transition:left .28s cubic-bezier(.3,1.5,.5,1),top .28s cubic-bezier(.3,1.5,.5,1)}
  .jletter:active{box-shadow:0 2px 5px rgba(28,58,64,.2)}
  /* a swell, not a wobble: the letter never tilts and never changes shape.
     It waits a moment first - a child who presses straight away never sees it,
     and it is a hint rather than a demand for attention. */
  .jletter.nudge{animation:swell 1.5s ease-in-out 1.4s infinite}
  @keyframes swell{0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.07)}}
  /* the mark alone sits on a dotted circle - the standard way to show a
     combining mark with nothing under it. The circle is a placeholder, so it
     is pale and the mark itself carries the colour. */
  .jletter .mark{color:var(--mark)}
  .jletter.settled .mark{color:var(--go)}
  .markalone{color:#C8C2B4}
  .jletter.settled{background:var(--gobg);color:var(--go);
    box-shadow:0 0 0 4px var(--go),0 4px 10px rgba(28,58,64,.16);animation:none}
  @media (prefers-reduced-motion:reduce){
    .jletter{transition:none} .jletter.nudge{animation:none}
  }
  .pdot{position:absolute;top:12px;transform:translateX(-50%);width:12px;height:12px;
    border-radius:50%;background:rgba(46,143,152,.28)}
  .pdot.on{background:var(--accent)}
  .meetsay{font-size:13px;color:var(--muted);margin:14px 0 0;text-align:center;line-height:1.4}
  /* ---- the step strip and the two-way pair, as Janngu has them ----
     Three round buttons under the card, same place on every screen; and inside
     the card, once the presses are done, hear-it-again beside the way on. */
  .stepnav{display:flex;align-items:center;gap:8px;width:100%;margin:12px 0 2px;padding:2px}
  .stepnav button{width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;
    background:var(--paper);color:var(--deep);display:grid;place-items:center;font-family:inherit}
  .stepnav button svg{width:22px;height:22px}
  .stepnav button.fwd svg{transform:scaleX(-1)}
  .stepnav button:active{transform:translateY(2px)}
  .stepnav button[disabled]{background:#F2EFE8;color:#C9C7C0;cursor:default}
  .stepnav button[disabled]:active{transform:none}
  .stepnav button.restart{opacity:.72}
  /* what you can read now: the Book's own words, on the board's colour */
  .reads{display:grid;gap:9px;margin:14px 0 6px}
  .rline{display:block;width:100%;border:0;cursor:pointer;font:inherit;text-align:center;
    background:#EDE7DA;border-radius:16px;padding:15px 12px;color:#3A3226;
    box-shadow:inset 0 2px 10px rgba(90,70,40,.10)}
  .rline:active{transform:translateY(1px)}
  .ra{display:block;font-size:30px;line-height:1.9}
  .rt{display:block;font-size:12.5px;font-weight:700;color:#7A6A52;margin-top:4px}
  /* ---- lesson 2: the letter, then the same letter inside real words ----
     (These rules were lost when an earlier patch died halfway: the markup
     shipped, the styling did not.) */
  .selfrow{text-align:center;margin:8px 0 2px}
  .selfglyph{display:inline-block;font-size:66px;line-height:1.35;color:var(--ink)}
  .selfname{display:block;font-size:11.5px;font-weight:750;color:var(--muted);letter-spacing:.03em}
  /* the chart row: three forms, each its own button, in word order */
  .formrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 10px;direction:rtl}
  .formtile{background:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:14px 6px 10px;cursor:pointer;font:inherit;color:var(--ink)}
  .formtile .fg{display:block;font-size:46px;line-height:1.45}
  .formtile .fl{display:block;margin-top:6px;font-size:11px;font-weight:750;
    color:var(--muted);direction:ltr;letter-spacing:.02em}
  .formtile.got{background:var(--gobg);border-color:#BFDCCD}
  .formtile.got .fl{color:var(--go)}
  .formtile.live{outline:2px solid var(--accent);outline-offset:1px}
  .formtile:active{transform:translateY(1px)}
  /* the word it lives in, on the board's own colour */
  .proof{min-height:74px;display:grid;place-items:center;gap:2px;border-radius:16px;
    background:#F2EFE8;padding:10px;transition:background .2s}
  .proof.on{background:#EDE7DA;box-shadow:inset 0 2px 10px rgba(90,70,40,.10)}
  .proof .pw{font-size:40px;line-height:1.7;direction:rtl;color:#3A3226}
  .proof .pt{font-size:12px;font-weight:700;color:#7A6A52}
  .coatbig{text-align:center;font-size:96px;line-height:1.5;background:var(--paper);
    border-radius:20px;padding:6px 10px;margin:4px 0 10px;color:var(--mark)}
  .coatword{text-align:center;font-size:44px;line-height:1.8;margin-top:10px}
  .coatask{text-align:center;font-size:72px;line-height:1.5;background:var(--paper);
    border-radius:20px;padding:10px;margin:12px 0 2px}
  .twoway{display:flex;gap:9px;width:100%;margin-top:13px}
  .tw{flex:1 1 44%;min-width:0;min-height:54px;border:0;border-radius:18px;font:inherit;
    font-size:15.5px;font-weight:750;cursor:pointer;display:grid;place-items:center}
  .tw.again{flex:0 0 34%;background:var(--paper);color:var(--deep)}
  .tw.on{background:linear-gradient(180deg,#35A0A8,#268189);color:#fff}
  .tw:active{transform:translateY(1px)}
  .bars{display:inline-flex;gap:3px;align-items:flex-end;height:15px}
  .bars i{width:3.5px;background:currentColor;border-radius:2px;height:5px}
  .bars i:nth-child(2){height:15px}
  .bars i:nth-child(3){height:9px}
  /* the board a child reads their row from */
  .board{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;
    background:#EDE7DA;border:1px solid #DFD6C4;border-radius:18px;
    padding:16px 12px;margin:14px 0 2px;cursor:pointer;
    box-shadow:inset 0 2px 10px rgba(90,70,40,.10)}
  .bw{font-size:38px;line-height:1.2;padding:4px 10px;border-radius:12px;color:#3A3226;
    transition:background .18s,color .18s,transform .18s}
  .bw.lit{background:#fff;color:var(--deep);transform:translateY(-3px);
    box-shadow:0 3px 10px rgba(28,58,64,.18)}
  .hero{text-align:center;margin:8px 0 2px}
  .hero .g{font-size:78px;line-height:1.25}
  .hero .n{font-size:13px;font-weight:700;color:var(--muted)}

  .play{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;
    background:linear-gradient(180deg,#35A0A8,#268189);color:#fff;font:inherit;
    font-size:15px;font-weight:750;padding:11px 20px;cursor:pointer}
  .play:active{opacity:.82}
  .mute{display:block;margin-top:7px;font:11.5px/1.4 ui-monospace,Menlo,monospace;color:#9AA7AB}

  .steps{display:flex;gap:5px;margin:2px 0 10px}
  .steps i{flex:1;height:4px;border-radius:2px;background:#E7E2D7}
  .steps i.on{background:var(--accent)}

  .note{border-left:3px solid var(--accent);background:var(--paper);border-radius:0 12px 12px 0;
    padding:11px 13px;font-size:13.5px;line-height:1.5;margin-top:12px;color:#41525B}
  .note b{color:var(--ink)}

  .hold{width:100%;height:14px;border-radius:8px;background:#E7E2D7;overflow:hidden;margin:10px 0 2px}
  .hold i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35A0A8,#D9A22E)}

  .bar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:430px;margin:0 auto;display:flex;gap:9px;background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);border-radius:26px;padding:9px;
    box-shadow:0 6px 24px rgba(28,58,64,.18)}
  .btn{flex:1;border:0;border-radius:18px;background:var(--paper);color:var(--ink);
    font:inherit;font-size:14.5px;font-weight:750;padding:12px;cursor:pointer}
  .btn.go{background:linear-gradient(180deg,#35A0A8,#268189);color:#fff}
  .btn:disabled{opacity:.4}

  .sheet{position:fixed;inset:0;background:rgba(20,30,34,.45);display:none;z-index:40}
  .sheet.on{display:block}
  .sheetin{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto}
  .sheetin h3{margin:0 0 10px;font-size:17px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="brand">Alluwal<small>the board, from the first letter</small></span>
    <button class="ghost" onclick="openDrawer()">Grown-ups</button>
  </div>
  <div id="view"></div>
</div>

<div class="bar" id="bar"></div>

<div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeDrawer()">
  <div class="sheetin" id="sheetin"></div>
</div>

<script>
/* ===================================================================
   Alluwal — al-Qa'idah al-Nuraniyyah, sixteen lessons.
   Method: Shaykh Nur Muhammad Haqqani, edition of M. M. Faruq al-Ra'i.
   We teach the method; we do not claim it.

   Audio is wired and silent. Every clip has a path; nothing has been
   recorded, so play() fails quietly and the path is shown instead. When
   the recordings land, drop them in and nothing here changes.
   =================================================================== */

const AUDIO = { base:"audio/", ext:".mp3", on:true };
let lastPath="";
function play(path){
  lastPath = AUDIO.base + path + AUDIO.ext;
  const el=document.getElementById('mute');
  if(el) el.textContent = lastPath + "  (not recorded yet)";
  if(!AUDIO.on) return;
  try{
    const a=new Audio(lastPath);
    a.play().catch(()=>{});          /* silence is the expected state for now */
  }catch(e){}
}

/* ---------- the alphabet ---------- */
const L = [
 ["ا","alif"],["ب","ba"],["ت","ta"],["ث","tha"],["ج","jim"],["ح","ha"],
 ["خ","kha"],["د","dal"],["ذ","dhal"],["ر","ra"],["ز","zay"],["س","sin"],
 ["ش","shin"],["ص","sad"],["ض","dad"],["ط","ta (tah)"],["ظ","dha (dhah)"],["ع","ayn"],
 ["غ","ghayn"],["ف","fa"],["ق","qaf"],["ك","kaf"],["ل","lam"],["م","mim"],
 ["ن","nun"],["ه","ha (hah)"],["و","waw"],["ي","ya"]
];
const key = n => n.replace(/[^a-z]/g,"");          /* file-safe name */

/* joined shapes, shown as the book shows them */
const JOINED = [
 ["ب","بـ","ـبـ","ـب","ba"],["ت","تـ","ـتـ","ـت","ta"],["ج","جـ","ـجـ","ـج","jim"],
 ["س","سـ","ـسـ","ـس","sin"],["ع","عـ","ـعـ","ـع","ayn"],["ك","كـ","ـكـ","ـك","kaf"],
 ["ل","لـ","ـلـ","ـل","lam"],["م","مـ","ـمـ","ـم","mim"],["ن","نـ","ـنـ","ـن","nun"],
 ["ه","هـ","ـهـ","ـه","ha"],["ي","يـ","ـيـ","ـي","ya"],["ف","فـ","ـفـ","ـف","fa"]
];

/* A word per position, for every letter in lesson 2. Ordinary words, no
   harakat - nothing here is read yet, it is looked at. The number is where the
   letter sits in the word, counting from the right as the string runs.
   Checked one by one; a qualified reader should check them again. */
const INWORD = {
 "ba":   [["\u0628\u064A\u062A",0,"bayt \u00b7 house"],["\u0635\u0628\u0631",1,"sabr \u00b7 patience"],["\u0643\u062A\u0628",2,"kataba \u00b7 he wrote"]],
 "ta":   [["\u062A\u0645\u0631",0,"tamr \u00b7 dates"],["\u0643\u062A\u0628",1,"kataba \u00b7 he wrote"],["\u0628\u064A\u062A",2,"bayt \u00b7 house"]],
 "jim":  [["\u062C\u0628\u0644",0,"jabal \u00b7 mountain"],["\u0633\u062C\u062F",1,"sajada \u00b7 he prostrated"],["\u062E\u0631\u062C",2,"kharaja \u00b7 he went out"]],
 "sin":  [["\u0633\u062C\u062F",0,"sajada \u00b7 he prostrated"],["\u0645\u0633\u062C\u062F",1,"masjid \u00b7 mosque"],["\u062F\u0631\u0633",2,"dars \u00b7 a lesson"]],
 "ayn":  [["\u0639\u0645\u0644",0,"amal \u00b7 work"],["\u062C\u0639\u0644",1,"jaala \u00b7 he made"],["\u0633\u0645\u0639",2,"samia \u00b7 he heard"]],
 "kaf":  [["\u0643\u062A\u0628",0,"kataba \u00b7 he wrote"],["\u0633\u0643\u0646",1,"sakana \u00b7 he dwelt"],["\u0645\u0644\u0643",2,"malik \u00b7 king"]],
 "lam":  [["\u0644\u0628\u0646",0,"laban \u00b7 milk"],["\u0645\u0644\u0643",1,"malik \u00b7 king"],["\u062C\u0639\u0644",2,"jaala \u00b7 he made"]],
 "mim":  [["\u0645\u0644\u0643",0,"malik \u00b7 king"],["\u0639\u0645\u0644",1,"amal \u00b7 work"],["\u0639\u0644\u0645",2,"ilm \u00b7 knowledge"]],
 "nun":  [["\u0646\u0648\u0631",0,"nur \u00b7 light"],["\u0645\u0646\u0639",1,"manaa \u00b7 he prevented"],["\u0644\u0628\u0646",2,"laban \u00b7 milk"]],
 "ha":   [["\u0647\u0631\u0628",0,"haraba \u00b7 he fled"],["\u0633\u0647\u0644",1,"sahl \u00b7 easy"],["\u0648\u062C\u0647",2,"wajh \u00b7 face"]],
 "ya":   [["\u064A\u062F",0,"yad \u00b7 hand"],["\u0628\u064A\u062A",1,"bayt \u00b7 house"],["\u0646\u0628\u064A",2,"nabi \u00b7 prophet"]],
 "fa":   [["\u0641\u062A\u062D",0,"fataha \u00b7 he opened"],["\u0646\u0641\u0633",1,"nafs \u00b7 soul"],["\u062E\u0648\u0641",2,"khawf \u00b7 fear"]]
};
/* Colouring one letter inside an Arabic word breaks the joining, because the
   browser shapes each element separately. A zero-width joiner on each cut end
   tells it to keep the joined form - so the word still reads as a word and one
   letter is a different colour. */
const ZWJ="\u200d";
function wordHTML(w, i){
  const before=w.slice(0,i), targ=w[i], after=w.slice(i+1);
  const b = before ? `<span>${before}${ZWJ}</span>` : "";
  const t = `<span class="mark">${before?ZWJ:""}${targ}${after?ZWJ:""}</span>`;
  const a = after ? `<span>${ZWJ}${after}</span>` : "";
  return b+t+a;
}

const MUQ = [
 ["الم","alif-lam-mim"],["المص","alif-lam-mim-sad"],["الر","alif-lam-ra"],
 ["المر","alif-lam-mim-ra"],["كهيعص","kaf-ha-ya-ayn-sad"],["طه","ta-ha"],
 ["طسم","ta-sin-mim"],["طس","ta-sin"],["يس","ya-sin"],["ص","sad"],
 ["حم","ha-mim"],["حم عسق","ha-mim-ayn-sin-qaf"],["ق","qaf"],["ن","nun"]
];

/* the marks. Built from the letters rather than typed, so a slip is
   impossible and the set can be widened without retyping anything. */
const FATHA="\u064E", KASRA="\u0650", DAMMA="\u064F",
      FATHTAN="\u064B", KASRTAN="\u064D", DAMMTAN="\u064C",
      SUKUN="\u0652", SHADDA="\u0651",
      SMALL_ALIF="\u0670";

const CORE = ["ب","ت","ث","ج","د","ر","س","ط","ك","ل","م","ن"];   /* early practice set */
const mk = (base, mark) => base + mark;

function harakahSet(){
  const out=[];
  CORE.forEach(b=>{
    const n=L.find(x=>x[0]===b)[1];
    out.push([mk(b,FATHA), key(n)+"-a", "fathah"]);
    out.push([mk(b,KASRA), key(n)+"-i", "kasrah"]);
    out.push([mk(b,DAMMA), key(n)+"-u", "dammah"]);
  });
  return out;
}
function tanweenSet(){
  const out=[];
  CORE.forEach(b=>{
    const n=key(L.find(x=>x[0]===b)[1]);
    out.push([mk(b,FATHTAN), n+"-an", "two above"]);
    out.push([mk(b,KASRTAN), n+"-in", "two below"]);
    out.push([mk(b,DAMMTAN), n+"-un", "two in front"]);
  });
  return out;
}
function sukoonSet(){
  return CORE.map(b=>{
    const n=key(L.find(x=>x[0]===b)[1]);
    return ["\u0623"+mk(b,SUKUN), "ab-"+n, "still"];
  });
}
function shaddaSet(){
  return CORE.map(b=>{
    const n=key(L.find(x=>x[0]===b)[1]);
    return ["\u0623"+b+SHADDA+FATHA, "shadda-"+n, "doubled"];
  });
}
const MADD = [
 ["بَا","ba-madd","alif"],["بِي","bi-madd","ya"],["بُو","bu-madd","waw"],
 ["تَا","ta-madd","alif"],["تِي","ti-madd","ya"],["تُو","tu-madd","waw"],

/* ---------- a lesson ----------
   v2: the letter is met the way Janngu meets a letter, because that is the
   only shape that makes a child listen before moving on. One letter at a
   time: it says itself, and it has to be pressed three times before the way
   on appears. Three presses is not decoration - it is the drill. A grid of
   six pressable tiles let a child tap six times in two seconds and learn
   nothing, which is what this replaces.

   A group is met one item at a time, then asked back: each item found from
   three, in a different order. Nothing is asked that has not been pressed. */
/* Janngu's eight spots, in Janngu's order. The letter lands on one of these
   per press, picked from the lesson, the item and the press count so the path
   is different for every letter but never random mid-press. */
const BACKSVG='<svg viewBox="0 0 26 26" aria-hidden="true">'
 +'<path d="M16.5 5.5 L9 13 L16.5 20.5" fill="none" stroke="currentColor" stroke-width="3.4" '
 +'stroke-linecap="round" stroke-linejoin="round"/>'
 +'<path d="M9 13 H20" fill="none" stroke="currentColor" stroke-width="3.4" '
 +'stroke-linecap="round" opacity=".55"/></svg>';
const RESVG='<svg viewBox="0 0 26 26" aria-hidden="true"><path d="M20 13a7 7 0 1 1-2.1-5" '
 +'fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path '
 +'d="M19.5 3.5V8H15" fill="none" stroke="currentColor" stroke-width="3.2" '
 +'stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SPOTS=[[50,26],[20,44],[78,44],[34,68],[66,70],[50,50],[16,22],[82,24]];
const PRESSES=3;
let cur=null, gi=0, idx=0, phase="meet", presses=0, ask=null, asked=[], wrong=0;
/* Where the learner has been. A cursor rather than a stack, so back and
   forward both work and stepping back does not throw the rest away: a child
   who wants to hear a letter again should not have to finish the lesson to
   reach it. */
let trail=[], tpos=-1;
const snap = () => ({gi,idx,ii,phase,presses,ask,asked:asked.slice()});
function mark(){
  trail=trail.slice(0,tpos+1);
  trail.push(snap());
  tpos=trail.length-1;
}
function restore(st){
  gi=st.gi; idx=st.idx; ii=st.ii||0; phase=st.phase; presses=st.presses;
  ask=st.ask; asked=st.asked.slice();
  /* A card with history in front of it was finished once already - three
     presses were done. Asking for them again to get back to where you were is
     a punishment for looking back, so the way on stays open and the presses
     are there to be used, not repeated. */
  if(phase==="meet" && tpos<trail.length-1) presses=PRESSES;
  paint();
}
function goBack(){ if(tpos>0){ tpos--; restore(trail[tpos]); } }
function goFwd(){ if(tpos<trail.length-1){ tpos++; restore(trail[tpos]); } }

function openLesson(id){
  cur=LESSONS.find(l=>l.id===id);
  gi=0; idx=0; ii=0; presses=0; ask=null; asked=[]; wrong=0;
  phase = INTRO[id] ? "intro" : "meet";
  trail=[]; tpos=-1; mark();
  paint();
}
function groups(){
  const n=cur.chunk||cur.items.length;
  const out=[]; for(let i=0;i<cur.items.length;i+=n) out.push(cur.items.slice(i,i+n));
  return out;
}
const group = () => groups()[gi];
const item  = () => group()[idx];
const clip  = it => (cur.path||"") + (it[1]||"x");

function paint(){
  if(phase==="intro") return paintIntro();
  if(phase==="meet") return cur.kind==="join" ? paintCoats() : paintMeet();
  return cur.kind==="join" ? paintFindJoin() : paintFind();
}

/* The mark itself, before any drilling of it: one letter the child already

let ii=0;
function paintIntro(){

    <p class="kick">${cur.id}. ${cur.t} \u00b7 the mark</p>
    <p class="sm" style="text-align:center;margin:2px 0 0">${ii+1} of ${rows.length}</p>
    <p class="cue">grown-up: this one is <b>${m[1]}</b><span>${m[2]}</span></p>
    <div class="jfield" id="field">
      <button class="jletter ar${presses===0?' nudge':''}${done?' settled':''}"
        id="tile" style="left:${at[0]}%;top:${at[1]}%" onclick="pressed()">${glyph}</button>
      ${[0,1,2].map((_,k)=>`<i class="pdot${k<presses?' on':''}"
        style="left:${50+(k-1)*9}%"></i>`).join("")}
    </div>
    <p class="meetsay">${m[3]}</p>
    <div id="after">${done?`<div class="twoway">
      <button class="tw again" onclick="pressAgain()" aria-label="hear it again">
        <span class="bars"><i></i><i></i><i></i></span></button>
      <button class="tw on" onclick="nextIntro()">${ii<rows.length-1?'next \u203a':'now the letters \u203a'}</button>
      </div>`:`<p class="meetsay" id="cap">${presses===0?"press it":`${PRESSES-presses} more`}</p>`}</div>
    <span class="mute" id="mute">${lastPath?lastPath+"  (not recorded yet)":"audio wired, nothing recorded yet"}</span>
  </div>
  ${stepnav()}`;
  setBar(`<button class="btn" onclick="road()">The road</button>`);
}
function nextIntro(){
  const rows=INTRO[cur.id]||[];
  if(ii<rows.length-1){ ii++; presses=0; mark(); return paintIntro(); }
  phase="meet"; presses=0; mark(); paint();
}

/* How a thing is drawn. The mark is coloured, the letter never is - so the eye
   goes to what the lesson is about. Restored with the new engine: it belonged
   to the old one and the rewrite still calls it. */
function cell(it){
  const g=it[0];
  if(cur.kind==="marks"||cur.kind==="words")
    return g.replace(/[\u064B-\u0652\u0670]/g, m=>`<span class="mark">${m}</span>`);
  /* On the board at the end of a group, a joined letter shows as itself. The
     three forms belong on the stage that teaches them, not crowded three-to-a-
     slot on a row meant to be read. */
  if(cur.kind==="join") return it[0];
  return g;
}

/* ---- meet: one thing, pressed three times ---- */
function paintMeet(){
  const it=item(), gs=groups(), total=cur.items.length;
  const seen=gi*(cur.chunk||total)+idx;
  const at=spotFor();
  const done=presses>=PRESSES;
  view.innerHTML=`<div class="card">
    <p class="kick">${cur.id}. ${cur.t}</p>
    <div class="steps">${gs.map((_,k)=>`<i class="${k<=gi?'on':''}"></i>`).join("")}</div>
    <p class="sm" style="text-align:center;margin:2px 0 0">${seen+1} of ${total}</p>

    <p class="cue">grown-up: it says <b>${it[2]||it[1]}</b>
      <span>innde: ${it[1]}</span></p>

    <div class="jfield" id="field">
      <button class="jletter ar${presses===0?' nudge':''}${done?' settled':''}"
        id="tile" style="left:${at[0]}%;top:${at[1]}%" onclick="pressed()">${cell(it)}</button>
      ${[0,1,2].map((_,k)=>`<i class="pdot${k<presses?' on':''}"
        style="left:${50+(k-1)*9}%"></i>`).join("")}
    </div>

    <div id="after">${done?twoway():`<p class="meetsay" id="cap">${presses===0?"press the letter":`${PRESSES-presses} more`}</p>`}</div>
    <span class="mute" id="mute">${lastPath?lastPath+"  (not recorded yet)":"audio wired, nothing recorded yet"}</span>
    ${cur.kind==="hold"?holdBlock():""}
  </div>
  ${stepnav()}`;
  setBar(`<button class="btn" onclick="road()">The road</button>`);
  if(cur.kind==="hold") wireHold();
}
/* ---- joined letters ----
   The chase was wrong here. It put the three coats in one tile and sent the
   lump round the box, so a child was catching a thing that was three things,
   and the one idea the lesson exists for - this is the SAME letter, wearing a
   different coat depending on where it stands - never got said.

   So: the letter itself at the top, still. Its three coats in a row underneath,
   in word order - at the start, in the middle, at the end. Each is pressed
   once; the press plays it and dresses it. Three presses, same as everywhere
   else, but each one now means something different instead of being the same
   press three times. */
const COATS=[["at the start",1],["in the middle",2],["at the end",3]];
function paintCoats(){
  const it=item(), gs=groups(), total=cur.items.length;
  const seen=gi*(cur.chunk||total)+idx;
  const got=coatsGot();
  const done=got.length>=3;
  const shown=coatShown[coatKey()]||0;
  const words=INWORD[it[4]]||[];
  const w=shown?words[shown-1]:null;
  view.innerHTML=`<div class="card">
    <p class="kick">${cur.id}. ${cur.t}</p>
    <div class="steps">${gs.map((_,k)=>`<i class="${k<=gi?'on':''}"></i>`).join("")}</div>
    <p class="sm" style="text-align:center;margin:2px 0 0">${seen+1} of ${total}</p>

    <div class="selfrow"><span class="selfglyph ar">${it[0]}</span>
      <span class="selfname">${it[4]} \u00b7 on its own</span></div>

    <!-- the chart's own row: the three coats, each its own button -->
    <div class="formrow">${COATS.map(([label,ix])=>`
      <button class="formtile${got.indexOf(ix)>=0?' got':''}${shown===ix?' live':''}"
        onclick="coatPress(${ix})">
        <span class="fg ar">${it[ix]}</span>
        <span class="fl">${label}</span>
      </button>`).join("")}</div>

    <!-- and what it looks like in a real word, once you have pressed one -->
    <div class="proof${w?' on':''}" id="proof">
      ${w?`<span class="pw ar">${wordHTML(w[0],w[1])}</span>
           <span class="pt">${w[2]}</span>`
         :`<span class="pt">press a form to see it in a word</span>`}
    </div>

    <div id="after">${done?twoway():`<p class="meetsay" id="cap">press each form \u2014 ${3-got.length} left</p>`}</div>
    <span class="mute" id="mute">${lastPath?lastPath+"  (not recorded yet)":"audio wired, nothing recorded yet"}</span>
  </div>
  ${stepnav()}`;
  setBar(`<button class="btn" onclick="road()">The road</button>`);
}
let coatSeen={}, coatShown={};
const coatKey = () => cur.id+"-"+gi+"-"+idx;
function coatsGot(){ return coatSeen[coatKey()]||[]; }

/* A press plays the form, marks it done, and shows the word it lives in. No
   modal: the word belongs on the same screen as the form, or a child cannot
   hold the two together, which is the whole point of the lesson. */
function coatPress(ix){
  const it=item(), k=coatKey();
  const got=(coatSeen[k]||[]).slice();
  if(got.indexOf(ix)<0) got.push(ix);
  coatSeen[k]=got; coatShown[k]=ix;
  presses=got.length;
  play(clip(it)+"-"+["","init","med","fin"][ix]);
  paintCoats();
}

/* Asked back: one coat on its own, and which letter is it? The question the
   lesson is actually about - not which sound, which LETTER. */
function paintFindJoin(){
  const g=group();
  const ix=1+Math.floor(Math.random()*3);
  const pool=[ask].concat(g.filter(x=>x[4]!==ask[4]).sort(()=>Math.random()-.5).slice(0,2))
                  .sort(()=>Math.random()-.5);
  view.innerHTML=`<div class="card">
    <p class="kick">${cur.id}. ${cur.t} \u00b7 find it</p>
    <h2>Which letter is this?</h2>
    <p class="sm">${asked.length} of ${g.length} found</p>
    <div class="coatask ar">${ask[ix]}</div>
    <p class="meetsay">${COATS[ix-1][0]}</p>
    <div class="grid g3 ar">${pool.map((it,k)=>`
      <button class="tile" id="o${k}" onclick="answer('${it[4]}',${k})">
        <span class="g">${it[0]}</span><span class="n">${it[4]}</span>
      </button>`).join("")}</div>
    <p class="sm" id="res"></p>
    <div id="afterfind"></div>
  </div>
  ${stepnav()}`;
  setBar(`<button class="btn" onclick="road()">The road</button>`);
}

/* Hear it again, or go on. The pair the Fulfulde course shows once a letter
   has been pressed its three times: the way on is never the only thing there,
   because the commonest thing a child wants next is to hear it once more. */
function twoway(){
  return `<div class="twoway">
    <button class="tw again" onclick="pressAgain()" aria-label="hear it again">
      <span class="bars"><i></i><i></i><i></i></span></button>
    <button class="tw on" onclick="nextItem()">${idx<group().length-1?'next \u203a':'now find them \u203a'}</button>
  </div>`;
}
function pressAgain(){
  const it=item();
  play(clip(it));
  const t=document.getElementById('tile');
  if(t){ const at=SPOTS[(cur.id*5+idx*3+(presses+1)*3)%SPOTS.length];
    t.style.left=at[0]+'%'; t.style.top=at[1]+'%'; }
}

/* Where it lands: lesson, item and press together, so the route round the box
   differs per letter and a child cannot learn the path instead of the sound. */
function spotFor(){
  return SPOTS[(cur.id*5 + idx*3 + presses*3) % SPOTS.length];
}
/* What is on screen to be pressed: a mark during the teaching stage, a letter
   the rest of the time. */
const shown = () => {
  if(phase==="intro"){ const m=(INTRO[cur.id]||[])[ii]; return [m[0], m[1], m[1]]; }
  return item();
};
function pressed(){
  /* Patched in place, never re-rendered: the first version added the animation
     class and then rebuilt the card, replacing the element the animation was
     running on. Here the letter also has to keep its identity so left/top can
     transition - a new element would teleport. */
  const it=shown();
  presses=Math.min(PRESSES,presses+1);
  play(phase==="intro" ? "marks/"+it[1] : clip(it));

  const t=document.getElementById('tile');
  if(t){
    const at=spotFor();
    t.classList.remove('nudge');          /* the hint has done its job */
    t.style.left=at[0]+'%';
    t.style.top =at[1]+'%';
    if(presses>=PRESSES) t.classList.add('settled');
  }

  const field=document.getElementById('field');
  if(field) field.querySelectorAll('.pdot').forEach((d,k)=>
    d.classList.toggle('on', k<presses));

  const after=document.getElementById('after');
  if(after){
    if(presses>=PRESSES){
      if(phase==="intro") return paintIntro();       /* its pair says something else */
      after.innerHTML=twoway();                      /* the pair replaces the count */
    }else after.innerHTML=`<p class="meetsay" id="cap">${PRESSES-presses} more</p>`;
  }
}
function nextItem(){
  if(idx<group().length-1){ idx++; presses=0; mark(); return paint(); }
  phase="find"; asked=[]; wrong=0; mark(); nextAsk();
}

/* ---- find: each one asked back, from three ---- */
function nextAsk(){
  const g=group();
  const idKey = x => cur.kind==="join" ? x[4] : x[1];
  const left=g.filter(x=>asked.indexOf(idKey(x))<0);
  if(!left.length) return paintRow();       /* the group is finished: say it back */
  ask=left[Math.floor(Math.random()*left.length)];
  locked=false;          /* the round is the thing that locks, not the screen */
  paint();
}
let locked=false;
function paintFind(){
  const g=group();
  const others=g.filter(x=>x[1]!==ask[1]).sort(()=>Math.random()-.5).slice(0,2);
  const pool=[ask].concat(others).sort(()=>Math.random()-.5);
  view.innerHTML=`<div class="card">
    <p class="kick">${cur.id}. ${cur.t} \u00b7 find it</p>
    <h2>Which one did you hear?</h2>
    <p class="sm">${asked.length} of ${g.length} found</p>
    <button class="play" onclick="play('${clip(ask)}');paintMuteOnly()">\u25b6 Hear it</button>
    <span class="mute" id="mute">press to play \u2014 nothing recorded yet</span>
    <div class="grid ${pool[0][0].length>2?'g2':'g3'} ar">${pool.map((it,k)=>`
      <button class="tile" id="o${k}" onclick="answer('${it[1]}',${k})">
        <span class="g">${cell(it)}</span><span class="n">${it[2]||it[1]}</span>
      </button>`).join("")}</div>
    <p class="sm" id="res"></p>
    <div id="afterfind"></div>
  </div>`;
  view.insertAdjacentHTML('beforeend', stepnav());
  setBar(`<button class="btn" onclick="road()">The road</button>`);
  play(clip(ask));                    /* it asks as soon as it arrives */
}
function paintMuteOnly(){
  const el=document.getElementById('mute');
  if(el) el.textContent=lastPath+"  (not recorded yet)";
}
function answer(k,slot){
  if(locked) return;                 /* a right answer ends the round */
  const mine = cur.kind==="join" ? ask[4] : ask[1];   /* joined items are keyed on the letter's name */
  const right = k===mine;
  document.getElementById('o'+slot).classList.add(right?'yes':'no');
  const res=document.getElementById('res');
  if(right){
    locked=true;
    asked.push(cur.kind==="join" ? ask[4] : ask[1]);
    res.textContent="Yes.";
    /* The way on belongs in the card, where the answer was given - the same
       pair the meeting screen ends with, so the forward button is always in
       the same place and always next to a way to hear it once more. */
    const after=document.getElementById('afterfind');
    if(after) after.innerHTML=`<div class="twoway">
      <button class="tw again" onclick="play('${clip(ask)}');paintMuteOnly()" aria-label="hear it again">
        <span class="bars"><i></i><i></i><i></i></span></button>
      <button class="tw on" onclick="mark();nextAsk()">next \u203a</button></div>`;
  }else{
    /* wrong answers send it back to the sound rather than to another guess */
    wrong++;
    res.textContent="Not that one \u2014 listen again.";
    play(clip(ask));
    paintMuteOnly();
  }
}
/* ---- the row ----
   The end of a group is the moment worth having: everything just met, in a
   line on the board, saying itself one after another. It is what a child does
   at the alluwal - reads the row back to the teacher - and it is the only
   reward in here that is also the practice. */
let rowTimer=null;
function paintRow(){
  const g=group(), last = gi>=groups().length-1;
  view.innerHTML=`<div class="card">
    <p class="kick">${cur.id}. ${cur.t}</p>
    <h2>Read your row</h2>
    <p class="sm">Six met, six found. Press the board to hear them all.</p>
    <div class="board" id="board">${g.map((it,k)=>`
      <span class="bw ar" id="bw${k}">${cell(it)}</span>`).join("")}</div>
    <p class="meetsay" id="rowcap">press the board</p>
    <span class="mute" id="mute">${lastPath?lastPath:"audio wired, nothing recorded yet"}</span>
  </div>`;
  setBar(`<button class="btn" onclick="road()">The road</button>
    <button class="btn go" onclick="${last?`finish(${cur.id})`:'nextGroup()'}">
      ${last?'Finish':'Next six'}</button>`);
  const b=document.getElementById('board');
  if(b) b.onclick=()=>sayRow(g);
}
function sayRow(g){
  clearTimeout(rowTimer);
  let k=0;
  const step=()=>{
    g.forEach((_,j)=>{
      const el=document.getElementById('bw'+j);
      if(el) el.classList.toggle('lit', j===k);
    });
    if(k<g.length){ play(clip(g[k])); k++; rowTimer=setTimeout(step,900); }
    else{
      g.forEach((_,j)=>document.getElementById('bw'+j)?.classList.remove('lit'));
      const cap=document.getElementById('rowcap');
      if(cap) cap.textContent="that is your row";
    }
  };
  step();
}
function nextGroup(){ gi++; idx=0; presses=0; phase="meet"; mark(); paint(); }

function paintDone(){
  const r=READS[cur.id];
  view.innerHTML=`<div class="card" style="text-align:center">
    <p class="kick">${cur.id}. ${cur.t}</p>
    <h2>Finished</h2>
    <p class="sm">${cur.items.length} met, each one pressed three times and found again.</p>
    <div class="note" style="text-align:left">${cur.adult}</div>
  </div>
  ${stepnav()}`;
  setBar(`<button class="btn" onclick="road()">The road</button>
          <button class="btn go" onclick="${r?`paintRead()`:`finish(${cur.id})`}">
            ${r?'What you can read now':'Done'}</button>`);
}

/* ---- what you can read now ----
   Not a reward bolted on: the thing the lesson was for, said plainly, in the
   Book's own words. Press a line to hear it. */
function paintRead(){
  const r=READS[cur.id];
  view.innerHTML=`<div class="card">
    <p class="kick">${cur.id}. ${cur.t}</p>
    <h2>${r.head}</h2>
    <div class="reads">${r.lines.map((ln,k)=>`
      <button class="rline" onclick="play('read/${cur.id}-${k+1}');document.getElementById('mute').textContent=lastPath+'  (not recorded yet)'">
        <span class="ra ar">${ln[0]}</span>
        <span class="rt">${ln[1]}</span>
      </button>`).join("")}</div>
    <p class="meetsay">${r.note}</p>
    <span class="mute" id="mute">press a line to hear it \u2014 nothing recorded yet</span>
  </div>`;
  setBar(`<button class="btn" onclick="road()">The road</button>
          <button class="btn go" onclick="finish(${cur.id})">Done</button>`);
}

/* madd, the one thing a screen teaches better than a page */
function holdBlock(){
  return `<div class="hold"><i id="hbar"></i></div>
    <p class="sm" id="hmsg">Press and hold. Two counts fills the bar.</p>
    <button class="play" id="hbtn">Hold to stretch</button>`;
}
function wireHold(){
  const btn=document.getElementById('hbtn'), bar2=document.getElementById('hbar'),
        msg=document.getElementById('hmsg');
  if(!btn) return;
  let t0=0, raf=null;
  const tick=()=>{
    const pct=Math.min(100,(Date.now()-t0)/2000*100);
    bar2.style.width=pct+'%';
    msg.textContent = pct<100 ? "Holding\u2026" : "Two counts. That is a madd.";
    if(pct<100) raf=requestAnimationFrame(tick);
  };
  const start=e=>{e.preventDefault();t0=Date.now();tick();};
  const stop=()=>{cancelAnimationFrame(raf);
    if(parseFloat(bar2.style.width)<100) msg.textContent="Let go too soon \u2014 try again.";};
  btn.addEventListener('mousedown',start); btn.addEventListener('touchstart',start,{passive:false});
  window.addEventListener('mouseup',stop); window.addEventListener('touchend',stop);
}

/* ---------- the grown-ups' drawer ---------- */
function openDrawer(){
  const l=cur||LESSONS[0];
  document.getElementById('sheetin').innerHTML=`
    <h3>${l.id}. ${l.t}</h3>
    <p class="sm">What to do</p>
    <div class="note">${l.adult}</div>
    <div class="note"><b>Why we never correct the sound.</b> The app cannot hear. You are the ear.
      If it sounds wrong, play the reciter again and say it together.</div>
    <div class="note"><b>The rule of the Qaida:</b> do not move on until the child reads the board
      themselves. Every lesson can be opened from the road, so that rule is yours to keep, not the
      app\u2019s to enforce \u2014 but inside a lesson nothing is skippable: each letter is heard its three
      times and found again before the way on appears.</div>
    <div class="note" style="border-color:var(--gold)"><b>Credit.</b> Alluwal teaches
      al-Qa\u2019idah al-Nuraniyyah of Shaykh Nur Muhammad Haqqani, in the edition prepared by
      M. Muhammad Faruq al-Ra\u2019i. We teach the method; we do not claim it.</div>
    <button class="btn go" style="width:100%;margin-top:12px" onclick="closeDrawer()">Close</button>`;
  document.getElementById('sheet').classList.add('on');
}
function closeDrawer(){ document.getElementById('sheet').classList.remove('on'); }

function resetAll(){
  if(!confirm("Start the whole board again?")) return;
  S={done:[],at:1}; save(); road();
}

road();
</script>
</body>
